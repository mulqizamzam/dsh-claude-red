name: Validate DSH plugin

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify package metadata and skills
        run: python3 scripts/validate_package.py
      - name: Smoke-test DSH skill provider contract
        run: node tests/smoke-provider.mjs
      - name: Build reproducible release archives
        run: |
          python3 scripts/package_release.py /tmp/release-a.zip
          python3 scripts/package_release.py /tmp/release-b.zip
          sha256sum /tmp/release-a.zip /tmp/release-b.zip
          cmp /tmp/release-a.zip /tmp/release-b.zip
          cp /tmp/release-a.zip /tmp/dsh-claude-red-0.2.1-rc.2.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-claude-red-0.2.1-rc.2
          path: /tmp/dsh-claude-red-0.2.1-rc.2.zip
          if-no-files-found: error

  runtime-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm for external profile plugins
        run: npm install --global pnpm@10
      - name: Install this plugin into the pinned DSH web profile
        run: npx --yes @deepseek-ai/dsh@0.2.1-rc.2 plugin --profile web add github:mulqizamzam/dsh-claude-red#main
      - name: Verify the composed profile contains this plugin
        run: |
          npx --yes @deepseek-ai/dsh@0.2.1-rc.2 --profile web --dump-config > /tmp/dsh-profile.yml
          grep -F 'dsh-claude-red' /tmp/dsh-profile.yml
      - name: Import installed provider and load every skill
        run: |
          cd "${DSH_HOME:-$HOME/.dsh}/profiles/web"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { apply } from 'dsh-claude-red';
          const providers = [];
          apply({ skills: { registerProvider(factory) { providers.push(factory()); } } });
          assert.equal(providers.length, 1);
          const provider = providers[0];
          const skills = await provider.list();
          assert.equal(skills.length, 12);
          for (const skill of skills) {
            const loaded = await provider.get(skill);
            assert.equal(loaded.name, skill.name);
            assert.ok(loaded.content.length > 500, `empty skill: ${skill.name}`);
          }
          console.log(`PASS: installed DSH package loaded ${skills.length} skill bodies.`);
          NODE
